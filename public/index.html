<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nayedaba</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container" style="padding-top:24px;">

  <div style="margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;">
    <input id="search" placeholder="🔍 Search stories by title..." style="flex:1;min-width:180px;">
    <select id="sort-select" style="max-width:170px;">
      <option value="updated">Recently Updated</option>
      <option value="popular">Most Popular</option>
      <option value="rating">Highest Rated</option>
      <option value="new">Newest</option>
    </select>
    <select id="status-select" style="max-width:130px;">
      <option value="">All Status</option>
      <option value="ongoing">Ongoing</option>
      <option value="completed">Completed</option>
      <option value="hiatus">Hiatus</option>
    </select>
    <div class="tags-dropdown">
      <button class="secondary" id="tags-toggle">Tags ▾</button>
      <div class="tags-panel" id="tags-panel"></div>
    </div>
  </div>

  <div id="continue-section"></div>
  <div id="recommend-section"></div>

  <div class="section-title">✨ Recently Updated</div>
  <div id="recent-list" class="story-grid"><p class="muted">Loading...</p></div>

  <div class="section-title">📚 All Stories</div>
  <div id="story-list" class="story-grid"><p class="muted">Loading...</p></div>

</div>

<script src="/js/app.js"></script>
<script>
let selectedTags = [];

async function load() {
  const user = await renderNav();

  // Tags panel
  try {
    const { tags } = await api("/api/tags");
    document.getElementById("tags-panel").innerHTML = tags.length
      ? tags.map(t => `<label><input type="checkbox" value="${escapeHtml(t)}"> ${escapeHtml(t)}</label>`).join("")
      : `<span class="muted">No tags yet</span>`;
    document.querySelectorAll("#tags-panel input").forEach(cb => {
      cb.onchange = () => {
        selectedTags = [...document.querySelectorAll("#tags-panel input:checked")].map(c => c.value);
        loadStoryList();
      };
    });
  } catch (e) {}

  if (user) {
    try {
      const { continue_reading } = await api("/api/library");
      if (continue_reading.length) {
        const c = continue_reading[0];
        const pct = Math.round((c.chapter_number / c.total_chapters) * 100);
        document.getElementById("continue-section").innerHTML = `
          <div class="continue-compact">
            <div class="cc-info">
              <div class="cc-title">${escapeHtml(c.title)}</div>
              <div class="story-meta">Ch. ${c.chapter_number}/${c.total_chapters} · ${pct}%</div>
              <div class="progress-bar" style="max-width:200px;"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
            </div>
            <a class="btn small" href="/read.html?story=${c.story_id}&chapter=${c.chapter_number}">Continue →</a>
          </div>`;
      }
    } catch (e) {}

    try {
      const { stories, based_on } = await api("/api/recommendations");
      if (stories.length) {
        document.getElementById("recommend-section").innerHTML =
          `<div class="section-title">🪄 Because you liked ${escapeHtml(based_on)}</div>
           <div class="story-grid">${stories.map(renderCoverCard).join("")}</div>`;
      }
    } catch (e) {}
  }

  try {
    const { stories } = await api("/api/stories?sort=updated");
    document.getElementById("recent-list").innerHTML = stories.length
      ? stories.slice(0, 3).map(renderCoverCard).join("")
      : `<p class="muted">No stories yet.</p>`;
  } catch (e) {}

  loadStoryList();
}

async function loadStoryList() {
  const sort = document.getElementById("sort-select").value;
  const status = document.getElementById("status-select").value;
  const q = document.getElementById("search").value.trim();
  let url = `/api/stories?sort=${sort}`;
  if (status) url += `&status=${status}`;
  if (q) url += `&q=${encodeURIComponent(q)}`;
  if (selectedTags.length) url += `&genre=${encodeURIComponent(selectedTags.join(","))}`;
  try {
    const { stories } = await api(url);
    document.getElementById("story-list").innerHTML = stories.length
      ? stories.map(renderCoverCard).join("")
      : `<p class="muted">No stories matched.</p>`;
  } catch (e) {
    document.getElementById("story-list").innerHTML = `<p class="error-msg">Couldn't load stories.</p>`;
  }
}

document.getElementById("tags-toggle").onclick = () => {
  document.getElementById("tags-panel").classList.toggle("open");
};
document.addEventListener("click", (e) => {
  if (!e.target.closest(".tags-dropdown")) {
    document.getElementById("tags-panel").classList.remove("open");
  }
});
document.getElementById("search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") loadStoryList();
});
document.getElementById("sort-select").addEventListener("change", loadStoryList);
document.getElementById("status-select").addEventListener("change", loadStoryList);

load();
</script>
</body>
</html>
