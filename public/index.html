<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nayedaba</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container" style="padding-top:24px;">

  <div class="filter-row">
    <div class="search-box">
      <input id="search" placeholder="Search stories by title..." title="Matches either the title or the alternative title" style="border-radius:6px 0 0 6px;">
      <button id="search-btn" style="border-radius:0 6px 6px 0;" title="Search"></button>
    </div>
    <select id="sort-select">
      <option value="updated">Recently Updated</option>
      <option value="popular">Most Popular</option>
      <option value="rating">Highest Rated</option>
      <option value="new">Newest</option>
    </select>
    <select id="status-select">
      <option value="">All Status</option>
      <option value="ongoing">Ongoing</option>
      <option value="completed">Completed</option>
      <option value="hiatus">Hiatus</option>
    </select>
    <div class="tags-dropdown">
      <button class="secondary" id="tags-toggle">Tags ▾</button>
      <div class="tags-panel" id="tags-panel"></div>
    </div>
  </div>

  <div id="continue-section"></div>

  <div class="section-title">All Stories</div>
  <div id="story-list" class="story-grid"><p class="muted">Loading...</p></div>

</div>

<script src="/js/app.js"></script>
<script>
let selectedTags = [];

async function loadStoryList() {
  const sort = document.getElementById("sort-select").value;
  const status = document.getElementById("status-select").value;
  const q = document.getElementById("search").value.trim();
  let url = `/api/stories?sort=${sort}`;
  if (status) url += `&status=${status}`;
  if (q) url += `&q=${encodeURIComponent(q)}`;
  if (selectedTags.length) url += `&genre=${encodeURIComponent(selectedTags.join(","))}`;
  const listEl = document.getElementById("story-list");
  listEl.innerHTML = `<p class="muted">Loading...</p>`;
  try {
    const { stories } = await api(url);
    listEl.innerHTML = stories.length
      ? stories.map(renderCoverCard).join("")
      : `<p class="muted">No stories matched.</p>`;
  } catch (e) {
    listEl.innerHTML = `<p class="error-msg">Couldn't load stories: ${escapeHtml(e.message)}</p>`;
  }
}

// Wire controls immediately, before any data loads
document.getElementById("search-btn").innerHTML = icon("search");
document.getElementById("search-btn").onclick = loadStoryList;
document.getElementById("search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); loadStoryList(); }
});
document.getElementById("sort-select").addEventListener("change", loadStoryList);
document.getElementById("status-select").addEventListener("change", loadStoryList);
document.getElementById("tags-toggle").onclick = () => {
  document.getElementById("tags-panel").classList.toggle("open");
};
document.addEventListener("click", (e) => {
  if (!e.target.closest(".tags-dropdown")) {
    document.getElementById("tags-panel").classList.remove("open");
  }
});

async function load() {
  loadStoryList();

  try {
    const { tags } = await api("/api/tags");
    document.getElementById("tags-panel").innerHTML = tags.length
      ? tags.map(t => `<label><input type="checkbox" value="${escapeHtml(t)}"> ${escapeHtml(t)}</label>`).join("")
      : `<span class="muted">No tags yet</span>`;
    document.querySelectorAll("#tags-panel input").forEach(cb => {
      cb.onchange = () => {
        selectedTags = [...document.querySelectorAll("#tags-panel input:checked")].map(c => c.value);
        loadStoryList();
      };
    });
  } catch (e) {}

  const user = await renderNav();
  if (user) await loadHomeCards();
}

function continueCard(c) {
  const pct = Math.round((c.chapter_number / c.total_chapters) * 100);
  return `
    <div class="home-card">
      <div class="cc-info">
        <div class="cc-title">${escapeHtml(c.title)}${altTitleHtml(c.alt_title)}</div>
        <div class="story-meta">Ch. ${c.chapter_number}/${c.total_chapters} · ${pct}%</div>
        <div class="progress-bar" style="max-width:200px;"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <a class="btn small" href="/read.html?story=${c.story_id}&chapter=${c.chapter_number}">Continue ${icon("arrowRight")}</a>
    </div>`;
}

function quoteCard(q) {
  return `
    <div class="home-card quote-card">
      <div class="cc-info">
        <div class="quote-text">"${escapeHtml(q.quote_text)}"</div>
        <div class="story-meta" style="margin-top:4px;">
          — <a href="/story.html?id=${q.story_id}">${escapeHtml(q.story_title)}</a>, Ch. ${q.chapter_number}
        </div>
      </div>
    </div>`;
}

// The strip above the story grid: a random saved quote, what you're reading,
// either, or neither — whichever the reader turned on in Settings.
async function loadHomeCards() {
  const [reading, quote] = await Promise.all([
    homePrefs.showContinue
      ? api("/api/library").then(d => d.continue_reading[0] || null).catch(() => null)
      : null,
    homePrefs.showQuote
      ? api("/api/quote").then(d => d.quotes.length ? d.quotes[Math.floor(Math.random() * d.quotes.length)] : null).catch(() => null)
      : null
  ]);

  const cards = [];
  if (quote) cards.push(quoteCard(quote));
  if (reading) cards.push(continueCard(reading));
  if (!cards.length) return;

  document.getElementById("continue-section").innerHTML = `<div class="home-row">${cards.join("")}</div>`;
}

load();
</script>
</body>
</html>
