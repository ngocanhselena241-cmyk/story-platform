<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container" style="padding-top:24px;max-width:400px;">
  <h1>Log in</h1>
  <label>Email</label>
  <input id="email" type="email">
  <label>Password</label>
  <input id="password" type="password">
  <button id="submit-btn" style="margin-top:16px;">Log in</button>
  <div id="msg" class="error-msg"></div>
  <p class="muted" style="margin-top:20px;">No account? <a href="/signup.html">Sign up</a></p>
</div>

<script src="/js/app.js"></script>
<script>
renderNav();
document.getElementById("submit-btn").onclick = async () => {
  try {
    await api("/api/login", { method: "POST", body: JSON.stringify({
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    })});
    window.location.href = "/index.html";
  } catch (e) {
    document.getElementById("msg").textContent = e.message;
  }
};
</script>
</body>
</html>
