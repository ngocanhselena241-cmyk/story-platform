<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile — Nayedaba</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container" style="padding-top:24px;max-width:500px;">
  <div id="content"><p class="muted">Loading...</p></div>
</div>

<script src="/js/app.js"></script>
<script>
let avatarData = null;

async function load() {
  const user = await renderNav();
  const content = document.getElementById("content");
  if (!user) { content.innerHTML = `<p>You need to <a href="/login.html">log in</a>.</p>`; return; }

  const { profile } = await api("/api/profile");
  let badges = [];
  try { ({ achievements: badges } = await api("/api/stats")); } catch (e) {}

  let libraryLine = "See and edit everything you've collected.";
  try {
    const { libraries } = await api("/api/libraries");
    const stories = libraries.reduce((sum, lb) => sum + lb.story_count, 0);
    libraryLine = libraries.length
      ? `${libraries.length} librar${libraries.length === 1 ? "y" : "ies"} · ${stories} stor${stories === 1 ? "y" : "ies"}`
      : "No libraries yet — create your first one.";
  } catch (e) {}

  content.innerHTML = `
    <h1>Your profile</h1>
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;">
      <img id="avatar-img" src="${profile.avatar || ""}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;background:var(--accent);${profile.avatar ? "" : "display:none;"}">
      <div id="avatar-fallback" style="width:80px;height:80px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:${profile.avatar ? "none" : "flex"};align-items:center;justify-content:center;font-size:2rem;font-weight:700;">${escapeHtml(profile.username[0].toUpperCase())}</div>
      <div>
        <div style="font-size:1.2rem;font-weight:700;">${escapeHtml(profile.username)}</div>
        <div class="muted" style="font-size:0.85rem;">${escapeHtml(profile.role)} · joined ${new Date(profile.created_at).toLocaleDateString()}</div>
        <button class="small secondary" id="avatar-btn" style="margin-top:6px;">Change avatar</button>
      </div>
    </div>

    <label>Username</label>
    <input id="username" value="${escapeHtml(profile.username)}" maxlength="20">
    <div class="muted" style="font-size:0.8rem;margin-top:4px;">
      3–20 characters: letters, numbers, dots, dashes, underscores.
    </div>

    <label>Bio</label>
    <textarea id="bio" rows="3">${escapeHtml(profile.bio || "")}</textarea>

    <label>Badge shown next to your comments</label>
    <div id="badge-picker" style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="secondary small badge-opt" data-badge="">None</button>
      ${badges.filter(b => b.earned).map(b =>
        `<button class="secondary small badge-opt" data-badge="${b.icon}" title="${b.label}">${b.icon}</button>`).join("")}
    </div>

    <button id="save-btn" style="margin-top:12px;">Save profile</button>
    <div id="msg" class="error-msg"></div>

    <div class="section-title">Password</div>
    <div class="card">
      <label>Current password</label>
      <input type="password" id="pw-current" autocomplete="current-password">
      <label>New password</label>
      <input type="password" id="pw-new" autocomplete="new-password">
      <label>Repeat new password</label>
      <input type="password" id="pw-repeat" autocomplete="new-password">
      <button id="pw-btn" style="margin-top:12px;">Change password</button>
      <div id="pw-msg" class="error-msg"></div>
      <p class="muted" style="font-size:0.8rem;margin:8px 0 0;">
        At least 8 characters. Changing it signs you out everywhere else.
      </p>
    </div>

    <div class="section-title">Your libraries</div>
    <div class="card">
      <div class="muted" style="font-size:0.9rem;margin-bottom:10px;">${libraryLine}</div>
      <a class="btn small" href="/library.html">${icon("library")} Open my library</a>
    </div>

    <div class="section-title">Badges</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;">
      ${badges.filter(b => b.earned).map(b => `
        <div class="card" style="text-align:center;width:110px;">
          <div style="font-size:1.8rem;">${b.icon}</div>
          <div class="muted" style="font-size:0.75rem;">${b.label}</div>
        </div>`).join("") || `<p class="muted">No badges earned yet — go read something!</p>`}
    </div>
  `;

  document.getElementById("avatar-btn").onclick = () => {
    pickAndResizeImage(128, (dataUrl) => {
      avatarData = dataUrl;
      const img = document.getElementById("avatar-img");
      img.src = dataUrl;
      img.style.display = "block";
      document.getElementById("avatar-fallback").style.display = "none";
    });
  };

  let chosenBadge = profile.display_badge || "";
  document.querySelectorAll(".badge-opt").forEach(btn => {
    if (btn.dataset.badge === chosenBadge) btn.style.background = "var(--accent)";
    btn.onclick = () => {
      chosenBadge = btn.dataset.badge;
      document.querySelectorAll(".badge-opt").forEach(b => b.style.background = "");
      btn.style.background = "var(--accent)";
    };
  });

  document.getElementById("pw-btn").onclick = async () => {
    const msg = document.getElementById("pw-msg");
    const current = document.getElementById("pw-current").value;
    const next = document.getElementById("pw-new").value;
    const repeat = document.getElementById("pw-repeat").value;
    msg.className = "error-msg";
    if (next !== repeat) { msg.textContent = "The two new passwords don't match."; return; }
    try {
      await api("/api/password", { method: "POST", body: JSON.stringify({
        current_password: current, new_password: next
      })});
      msg.className = "success-msg";
      msg.textContent = "Password changed.";
      ["pw-current", "pw-new", "pw-repeat"].forEach(id => { document.getElementById(id).value = ""; });
    } catch (e) {
      msg.textContent = e.message;
    }
  };

  document.getElementById("save-btn").onclick = async () => {
    const msg = document.getElementById("msg");
    try {
      const { username } = await api("/api/profile", { method: "PUT", body: JSON.stringify({
        username: document.getElementById("username").value,
        bio: document.getElementById("bio").value,
        avatar: avatarData,
        display_badge: chosenBadge
      })});
      msg.className = "success-msg";
      msg.textContent = "Profile saved!";
      // The nav bar and the avatar initial both show the name — refresh them.
      if (username !== profile.username) load();
    } catch (e) {
      msg.className = "error-msg";
      msg.textContent = e.message;
    }
  };
}
load();
</script>
</body>
</html>
