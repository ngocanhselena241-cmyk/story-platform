<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report — Nayedaba</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container" style="padding-top:24px;max-width:500px;">
  <div id="gate"><p class="muted">Loading...</p></div>
</div>

<script src="/js/app.js"></script>
<script>
async function load() {
  const user = await renderNav();
  const gate = document.getElementById("gate");
  if (!user) { gate.innerHTML = `<p>You need to <a href="/login.html">log in</a> to send a report.</p>`; return; }

  gate.innerHTML = `
    <h1>Report a problem</h1>
    <label>What are you reporting?</label>
    <select id="target-type">
      <option value="story">A story</option>
      <option value="comment">A comment</option>
      <option value="user">A user</option>
      <option value="other">Something else</option>
    </select>
    <label>Link or name (paste the page link, or the username/story title)</label>
    <input id="target-ref" placeholder="https://... or a name">
    <label>Why are you reporting it?</label>
    <textarea id="reason" rows="4" placeholder="Describe the problem..."></textarea>
    <button id="submit-btn" style="margin-top:16px;">Send report</button>
    <div id="msg" class="error-msg"></div>
  `;

  document.getElementById("submit-btn").onclick = async () => {
    const msg = document.getElementById("msg");
    try {
      await api("/api/report", { method: "POST", body: JSON.stringify({
        target_type: document.getElementById("target-type").value,
        target_ref: document.getElementById("target-ref").value,
        reason: document.getElementById("reason").value
      })});
      msg.className = "success-msg";
      msg.textContent = "Report sent — an admin will take a look.";
      document.getElementById("target-ref").value = "";
      document.getElementById("reason").value = "";
    } catch (e) {
      msg.className = "error-msg";
      msg.textContent = e.message;
    }
  };
}
load();
</script>
</body>
</html>
