<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — Nayedaba</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container" style="padding-top:24px;max-width:500px;">
  <h1>Settings</h1>

  <div class="section-title">Theme</div>
  <div class="card">
    <label style="display:flex;align-items:center;gap:10px;margin:6px 0;">
      <input type="radio" name="theme" value="light" style="width:auto;"> <span class="meta-icon" id="i-light">Light</span>
    </label>
    <label style="display:flex;align-items:center;gap:10px;margin:6px 0;">
      <input type="radio" name="theme" value="white" style="width:auto;"> <span class="meta-icon" id="i-white">White</span>
    </label>
    <label style="display:flex;align-items:center;gap:10px;margin:6px 0;">
      <input type="radio" name="theme" value="dark" style="width:auto;"> <span class="meta-icon" id="i-dark">Dark</span>
    </label>
    <p class="muted" style="font-size:0.82rem;margin:8px 0 0;">
      White keeps the reading space plain white, with sage only on the bar and buttons.
    </p>
  </div>
  <div class="section-title">Home page</div>
  <div class="card">
    <label style="display:flex;align-items:center;gap:10px;margin:6px 0;">
      <input type="checkbox" id="pref-continue" style="width:auto;"> <span>Show what I'm currently reading</span>
    </label>
    <label style="display:flex;align-items:center;gap:10px;margin:6px 0;">
      <input type="checkbox" id="pref-quote" style="width:auto;"> <span>Show a random saved quote</span>
    </label>
    <p class="muted" style="font-size:0.82rem;margin:8px 0 0;">
      With both on they sit side by side; with one on it takes the whole strip.
    </p>
  </div>

  <p class="muted" style="font-size:0.85rem;">More settings coming later.</p>
</div>

<script src="/js/app.js"></script>
<script>
renderNav();
document.getElementById("i-light").innerHTML = `${icon("sun")}Light`;
document.getElementById("i-white").innerHTML = `${icon("contrast")}White`;
document.getElementById("i-dark").innerHTML = `${icon("moon")}Dark`;

function syncThemeRadios() {
  const picked = document.querySelector(`input[name="theme"][value="${currentTheme()}"]`);
  if (picked) picked.checked = true;
}
syncThemeRadios();
document.addEventListener("themechange", syncThemeRadios);
document.querySelectorAll('input[name="theme"]').forEach(radio => {
  radio.onchange = () => setTheme(radio.value);
});

const contBox = document.getElementById("pref-continue");
const quoteBox = document.getElementById("pref-quote");
contBox.checked = homePrefs.showContinue;
quoteBox.checked = homePrefs.showQuote;
contBox.onchange = () => { homePrefs.showContinue = contBox.checked; };
quoteBox.onchange = () => { homePrefs.showQuote = quoteBox.checked; };
</script>
</body>
</html>
