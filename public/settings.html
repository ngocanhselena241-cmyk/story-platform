<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — Nayedaba</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container" style="padding-top:24px;max-width:500px;">
  <h1>Settings</h1>

  <div class="section-title">Theme</div>
  <div class="card">
    <label style="display:flex;align-items:center;gap:10px;margin:6px 0;">
      <input type="radio" name="theme" value="light" style="width:auto;"> <span class="meta-icon" id="i-light">Light</span>
    </label>
    <label style="display:flex;align-items:center;gap:10px;margin:6px 0;">
      <input type="radio" name="theme" value="dark" style="width:auto;"> <span class="meta-icon" id="i-dark">Dark</span>
    </label>
  </div>
  <p class="muted" style="font-size:0.85rem;">More settings coming later.</p>
</div>

<script src="/js/app.js"></script>
<script>
renderNav();
document.getElementById("i-light").innerHTML = `${icon("sun")}Light`;
document.getElementById("i-dark").innerHTML = `${icon("moon")}Dark`;
const current = localStorage.getItem("theme") || "light";
document.querySelector(`input[name="theme"][value="${current}"]`).checked = true;
document.querySelectorAll('input[name="theme"]').forEach(radio => {
  radio.onchange = () => {
    document.documentElement.setAttribute("data-theme", radio.value);
    localStorage.setItem("theme", radio.value);
  };
});
</script>
</body>
</html>
