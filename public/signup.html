<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container" style="padding-top:24px;max-width:400px;">
  <h1>Sign up</h1>
  <label>Username</label>
  <input id="username">
  <label>Email</label>
  <input id="email" type="email">
  <label>Password (8+ characters)</label>
  <input id="password" type="password">
  <button id="submit-btn" style="margin-top:16px;">Create account</button>
  <div id="msg" class="error-msg"></div>
  <p class="muted" style="margin-top:20px;">Already have an account? <a href="/login.html">Log in</a></p>
</div>

<script src="/js/app.js"></script>
<script>
renderNav();
document.getElementById("submit-btn").onclick = async () => {
  try {
    await api("/api/signup", { method: "POST", body: JSON.stringify({
      username: document.getElementById("username").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    })});
    window.location.href = "/index.html";
  } catch (e) {
    document.getElementById("msg").textContent = e.message;
  }
};
</script>
</body>
</html>
