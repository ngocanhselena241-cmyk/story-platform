<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container" style="padding-top:24px;">
  <a href="/index.html" class="muted" id="back-link">Back to all stories</a>
  <div id="content"><p class="muted">Loading...</p></div>
</div>

<script src="/js/app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const storyId = params.get("id");
let currentUser = null;

// Tick-list of the reader's own libraries — a story can sit in as many as they like.
async function setupLibraryPicker() {
  const list = document.getElementById("library-list");
  const msg = document.getElementById("lib-msg");

  const renderList = (libraries) => {
    list.className = libraries.length ? "" : "muted";
    list.innerHTML = libraries.length
      ? libraries.map(lb => `
          <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin:4px 0;">
            <input type="checkbox" class="lib-check" value="${lb.id}" ${lb.has_story ? "checked" : ""}
                   style="width:auto;margin:0;">
            <span>${escapeHtml(lb.name)}</span>
            <span class="muted" style="font-size:0.8rem;">(${lb.story_count})</span>
          </label>`).join("")
      : "You don't have any libraries yet — create one below.";
  };

  const reload = async () => {
    const { libraries } = await api(`/api/libraries?story=${storyId}`);
    renderList(libraries);
  };

  try {
    await reload();
  } catch (e) {
    list.textContent = "Couldn't load your libraries.";
    return;
  }

  document.getElementById("new-lib-btn").onclick = async () => {
    const name = prompt("Name your new library:");
    if (name === null || !name.trim()) return;
    msg.textContent = "";
    try {
      // Keep whatever is already ticked, and tick the new library too.
      const checked = [...document.querySelectorAll(".lib-check:checked")].map(c => Number(c.value));
      const { library } = await api("/api/libraries", { method: "POST", body: JSON.stringify({ name }) });
      await reload();
      document.querySelectorAll(".lib-check").forEach(c => {
        c.checked = checked.includes(Number(c.value)) || Number(c.value) === library.id;
      });
    } catch (e) {
      msg.className = "error-msg";
      msg.textContent = e.message;
    }
  };

  document.getElementById("apply-lib-btn").onclick = async () => {
    const libraryIds = [...document.querySelectorAll(".lib-check:checked")].map(c => Number(c.value));
    try {
      await api("/api/library-items", { method: "POST", body: JSON.stringify({ story_id: Number(storyId), library_ids: libraryIds }) });
      await reload();
      msg.className = "success-msg";
      msg.textContent = libraryIds.length ? "Saved to your library!" : "Removed from your libraries.";
    } catch (e) {
      msg.className = "error-msg";
      msg.textContent = e.message;
    }
  };
}

async function load() {
  document.getElementById("back-link").innerHTML = `${icon("arrowLeft")} Back to all stories`;
  currentUser = await renderNav();
  try {
    const { story, chapters } = await api(`/api/story?id=${storyId}`);
    const genres = (story.genres || "").split(",").filter(Boolean).map(g => `<span class="tag">${escapeHtml(g.trim())}</span>`).join(" ");
    const rating = story.avg_rating ? Number(story.avg_rating).toFixed(1) : "Not yet rated";

    const isAdmin = currentUser && currentUser.role === "admin";
    const chapterList = chapters.length
      ? chapters.map(c => `<div class="card chapter-row" style="display:flex;justify-content:space-between;align-items:center;">
          <a href="/read.html?story=${storyId}&chapter=${c.chapter_number}">Chapter ${c.chapter_number}${c.title ? ": " + escapeHtml(c.title) : ""}</a>
          <span class="chapter-stats" style="display:flex;align-items:center;gap:12px;">
            <span class="muted" style="font-size:0.8rem;display:flex;align-items:center;gap:12px;">
              <span class="meta-icon" title="Views">${icon("eye")}${c.views || 0}</span>
              <span class="meta-icon" title="Comments">${icon("comment")}${c.comment_count || 0}</span>
              <span>${timeAgo(c.created_at)}</span>
            </span>
            ${isAdmin ? `<button class="small danger chap-del-btn" data-id="${c.id}" style="margin-left:8px;" title="Delete chapter">${icon("trash")}</button>` : ""}
          </span>
        </div>`).join("")
      : `<p class="muted">No chapters yet.</p>`;

    document.getElementById("content").innerHTML = `
      <div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;">
        ${story.cover ? `<img src="${story.cover}" style="width:160px;border-radius:10px;">` : ""}
        <div style="flex:1;min-width:240px;">
          <h1 style="margin-top:0;">${escapeHtml(story.title)}${altTitleHtml(story.alt_title)} <span id="edit-slot"></span></h1>
          <div class="story-meta">by ${escapeHtml(story.author_name)} · ${story.status} · <span class="meta-icon">${icon("star")}${rating}</span> (${story.rating_count} ratings) · <span class="meta-icon">${icon("eye")}${story.views}</span></div>
          <div style="margin:10px 0;">${genres}</div>
          <p>${escapeHtml(story.description)}</p>
        </div>
      </div>
      ${chapters.length ? `<a class="btn" href="/read.html?story=${storyId}&chapter=${chapters[0].chapter_number}">Start Reading</a>` : ""}
      ${currentUser ? `<button class="secondary" id="follow-btn" style="margin-left:8px;"></button>` : ""}
      ${currentUser ? `<div id="library-box" style="margin-top:16px;">
        <label>Add to your library</label>
        <div id="library-list" class="muted">Loading your libraries...</div>
        <div style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <button class="small secondary" id="new-lib-btn">${icon("plus")} Add a new library</button>
          <button class="small" id="apply-lib-btn">Apply</button>
          <span id="lib-msg" class="muted" style="font-size:0.85rem;"></span>
        </div>
      </div>` : ""}
      ${currentUser ? `<div id="rate-box" style="margin-top:16px;">
        <label>Rate this story (1-10)</label>
        <input type="number" id="rate-input" min="1" max="10" style="max-width:100px;display:inline-block;">
        <button id="rate-btn" class="small">Submit</button>
        <span id="rate-msg"></span>
      </div>` : ""}
      <div class="section-title">Chapters</div>
      ${chapterList}
    `;

    const rateBtn = document.getElementById("rate-btn");
    if (rateBtn) {
      rateBtn.onclick = async () => {
        try {
          await api("/api/rating", { method: "POST", body: JSON.stringify({
            story_id: storyId, rating: Number(document.getElementById("rate-input").value)
          })});
          document.getElementById("rate-msg").textContent = "Thanks for rating!";
        } catch (e) {
          document.getElementById("rate-msg").textContent = e.message;
        }
      };
    }

    if (document.getElementById("library-box")) await setupLibraryPicker();

    const followBtn = document.getElementById("follow-btn");
    if (followBtn) {
      const refresh = async () => {
        const { following, count } = await api(`/api/follow?story=${storyId}`);
        followBtn.innerHTML = following
          ? `${icon("bellOff")} Following (${count})`
          : `${icon("bell")} Follow (${count})`;
        followBtn.dataset.following = following;
      };
      await refresh();
      followBtn.onclick = async () => {
        await api("/api/follow", { method: "POST", body: JSON.stringify({ story_id: storyId }) });
        refresh();
      };
    }

    if (currentUser) {
      try {
        const { stories: mine } = await api("/api/my-stories");
        if (mine.some(s => String(s.id) === String(storyId))) {
          document.getElementById("edit-slot").innerHTML =
            `<a class="btn secondary small" href="/upload.html?story=${storyId}">${icon("pencil")} Edit</a>`;
        }
      } catch (e) {}

      if (currentUser.role === "admin") {
        document.getElementById("edit-slot").innerHTML +=
          ` <button class="danger small" id="admin-del-story">${icon("trash")} Delete story</button>`;
        document.getElementById("admin-del-story").onclick = async () => {
          if (!confirm("Permanently delete this story, all its chapters, and comments?")) return;
          await api(`/api/admin/story?id=${storyId}`, { method: "DELETE" });
          window.location.href = "/index.html";
        };
        document.querySelectorAll(".chap-del-btn").forEach(btn => {
          btn.onclick = async () => {
            if (!confirm("Delete this chapter and its comments?")) return;
            await api(`/api/admin/chapter?id=${btn.dataset.id}`, { method: "DELETE" });
            location.reload();
          };
        });
      }
    }
  } catch (e) {
    document.getElementById("content").innerHTML = `<p class="error-msg">Couldn't load this story.</p>`;
  }
}
load();
</script>
</body>
</html>
