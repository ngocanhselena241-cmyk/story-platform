<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discussion — Nayedaba</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container" style="padding-top:24px;max-width:700px;">
  <a href="/discussion.html" class="muted" id="back-link">Back to discussion</a>
  <div id="content"><p class="muted">Loading...</p></div>
  <div class="section-title">Comments</div>
  <div id="comment-form"></div>
  <div id="comments"></div>
</div>

<script src="/js/app.js"></script>
<script>
const threadId = new URLSearchParams(location.search).get("id");
let currentUser = null;

async function load() {
  document.getElementById("back-link").innerHTML = `${icon("arrowLeft")} Back to discussion`;
  currentUser = await renderNav();
  try {
    const { thread, comments, my_vote } = await api(`/api/thread?id=${threadId}`);
    const avatar = thread.avatar
      ? `<img class="comment-avatar" src="${thread.avatar}">`
      : `<div class="comment-avatar">${escapeHtml(thread.username[0].toUpperCase())}</div>`;

    document.getElementById("content").innerHTML = `
      <h1 style="margin-bottom:6px;">${escapeHtml(thread.title)}</h1>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        ${avatar}
        <span><a href="/user.html?name=${encodeURIComponent(thread.username)}">${escapeHtml(thread.username)}</a>
        <span class="muted" style="font-size:0.8rem;"> · ${thread.category} · ${timeAgo(thread.created_at)}</span></span>
      </div>
      <div style="white-space:pre-wrap;">${escapeHtml(thread.content)}</div>
      ${thread.image ? `<img src="${thread.image}" style="max-width:100%;border-radius:10px;margin-top:12px;">` : ""}
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="secondary" id="like-btn" style="${my_vote === 1 ? "background:var(--accent);color:#fff;" : ""}">${icon("thumbUp")} <span id="like-count">${thread.likes}</span></button>
        <button class="secondary" id="dislike-btn" style="${my_vote === -1 ? "background:var(--danger);color:#fff;" : ""}">${icon("thumbDown")} <span id="dislike-count">${thread.dislikes}</span></button>
      </div>
    `;

    const vote = async (v) => {
      if (!currentUser) { window.location.href = "/login.html"; return; }
      const res = await api("/api/thread-vote", { method: "POST", body: JSON.stringify({ thread_id: threadId, vote: v }) });
      document.getElementById("like-count").textContent = res.likes;
      document.getElementById("dislike-count").textContent = res.dislikes;
    };
    document.getElementById("like-btn").onclick = () => vote(1);
    document.getElementById("dislike-btn").onclick = () => vote(-1);

    renderComments(comments);

    if (currentUser) {
      document.getElementById("comment-form").innerHTML = `
        <textarea id="c-input" rows="3" placeholder="Write a comment..."></textarea>
        <button id="c-btn" style="margin-top:8px;">Post comment</button>`;
      document.getElementById("c-btn").onclick = async () => {
        const content = document.getElementById("c-input").value.trim();
        if (!content) return;
        await api("/api/thread", { method: "POST", body: JSON.stringify({ thread_id: Number(threadId), content }) });
        document.getElementById("c-input").value = "";
        await reloadComments();
      };
    } else {
      document.getElementById("comment-form").innerHTML = `<p class="muted"><a href="/login.html">Log in</a> to comment.</p>`;
    }
  } catch (e) {
    document.getElementById("content").innerHTML = `<p class="error-msg">Couldn't load this post.</p>`;
  }
}

async function reloadComments() {
  const { comments } = await api(`/api/thread?id=${threadId}`);
  renderComments(comments);
}

function renderComments(comments) {
  const el = document.getElementById("comments");
  const opts = { kind: "thread", user: currentUser, canDelete: () => false };
  el.innerHTML = comments.length
    ? renderCommentTree(comments, opts)
    : `<p class="muted">No comments yet.</p>`;
  wireComments(el, {
    ...opts,
    onReply: async (parentId, content) => {
      await api("/api/thread", { method: "POST", body: JSON.stringify({
        thread_id: Number(threadId), content, parent_id: parentId
      })});
      await reloadComments();
    }
  });
}

load();
</script>
</body>
</html>
