<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top — Nayedaba</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="container" style="padding-top:24px;">
  <h1>Top</h1>
  <div class="section-title">✍️ Top Uploaders</div>
  <div id="uploaders"><p class="muted">Loading...</p></div>
  <div class="section-title">📖 Top Readers</div>
  <div id="readers"><p class="muted">Loading...</p></div>
</div>

<script src="/js/app.js"></script>
<script>
function row(rank, u, statText) {
  const avatar = u.avatar
    ? `<img class="comment-avatar" src="${u.avatar}">`
    : `<div class="comment-avatar">${escapeHtml(u.username[0].toUpperCase())}</div>`;
  return `<a class="card" style="display:flex;align-items:center;gap:12px;" href="/user.html?name=${encodeURIComponent(u.username)}">
    <strong style="width:26px;">${rank}</strong>${avatar}
    <span style="flex:1;font-weight:600;">${escapeHtml(u.username)}</span>
    <span class="muted" style="font-size:0.85rem;">${statText}</span>
  </a>`;
}

async function load() {
  await renderNav();
  const { uploaders, readers } = await api("/api/leaderboard");
  document.getElementById("uploaders").innerHTML = uploaders.length
    ? uploaders.map((u, i) => row(i + 1, u, `${u.story_count} stories · 👁 ${u.total_views}`)).join("")
    : `<p class="muted">No uploaders yet.</p>`;
  document.getElementById("readers").innerHTML = readers.length
    ? readers.map((u, i) => row(i + 1, u, `${u.chapters_read} chapters read`)).join("")
    : `<p class="muted">No readers yet.</p>`;
}
load();
</script>
</body>
</html>
